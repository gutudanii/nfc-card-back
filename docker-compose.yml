version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nfc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nfc"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: ["redis-server", "--appendonly", "yes"]

  minio:
    image: quay.io/minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - '9000:9000'
    volumes:
      - minio-data:/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: nfc
      DB_USER: postgres
      DB_PASSWORD: postgres
      SECURITY_JWT_SECRET: change-me-in-prod
      SECURITY_JWT_ACCESS_TOKEN_SECONDS: 900
      SECURITY_JWT_REFRESH_TOKEN_SECONDS: 2592000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_ENABLED: 'false'
    ports:
      - '8080:8080'
    restart: unless-stopped

volumes:
  db-data:
  minio-data:
