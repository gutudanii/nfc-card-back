server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET}
    access-token-seconds: ${SECURITY_JWT_ACCESS_TOKEN_SECONDS:900}
    refresh-token-seconds: ${SECURITY_JWT_REFRESH_TOKEN_SECONDS:2592000}
  rate-limit:
    auth-max: ${SECURITY_RATE_LIMIT_AUTH_MAX:20}
    tap-max: ${SECURITY_RATE_LIMIT_TAP_MAX:60}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:${DB_HOST:localhost}}:${DB_PORT:5432}/${DB_NAME:nfc}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO

mail:
  enabled: ${MAIL_ENABLED:false}
  from: ${MAIL_FROM:no-reply@toollix.app}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
