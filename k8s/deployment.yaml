apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfc-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nfc-backend
  template:
    metadata:
      labels:
        app: nfc-backend
    spec:
      containers:
        - name: nfc-backend
          image: toollix/nfc-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: nfc
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: nfc-backend-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nfc-backend-secrets
                  key: db-password
            - name: SECURITY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nfc-backend-secrets
                  key: jwt-secret
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: MAIL_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: nfc-backend
spec:
  selector:
    app: nfc-backend
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer
